# Theme: phosphor. Amber CRT monochrome: plain ASCII, reverse-video selection,
# a KITT scanner, blinking clock colons, and amber pane text (inactive panes dimmer).

tmux_conf_theme_colour_1="#0c0800"    # black glass
tmux_conf_theme_colour_2="#3d2a00"    # burnt
tmux_conf_theme_colour_3="#6b4a00"    # dim amber
tmux_conf_theme_colour_4="#ffb000"    # hot amber
tmux_conf_theme_colour_5="#ffb000"
tmux_conf_theme_colour_16="#ff5f00"   # root/sync warning

tmux_conf_theme_status_fg="#6b4a00"
tmux_conf_theme_status_bg="#0c0800"
tmux_conf_theme_status_attr="none"

tmux_conf_theme_left_separator_main=""
tmux_conf_theme_left_separator_sub=""
tmux_conf_theme_right_separator_main=""
tmux_conf_theme_right_separator_sub=""

tmux_conf_theme_window_status_fg="#6b4a00"
tmux_conf_theme_window_status_bg="#0c0800"
tmux_conf_theme_window_status_attr="none"
tmux_conf_theme_window_status_format="#I:#W#{?window_zoomed_flag,[Z],}"
tmux_conf_theme_window_status_current_fg="#0c0800"
tmux_conf_theme_window_status_current_bg="#ffb000"
tmux_conf_theme_window_status_current_attr="bold"
tmux_conf_theme_window_status_current_format="#I:#W#{?window_zoomed_flag,[Z],}"
tmux_conf_theme_window_status_activity_fg="#c98a00"
tmux_conf_theme_window_status_activity_bg="#0c0800"
tmux_conf_theme_window_status_activity_attr="underscore"
tmux_conf_theme_window_status_bell_fg="#ff5f00"
tmux_conf_theme_window_status_bell_bg="#0c0800"
tmux_conf_theme_window_status_bell_attr="blink,bold"
tmux_conf_theme_window_status_last_fg="#c98a00"
tmux_conf_theme_window_status_last_bg="#0c0800"
tmux_conf_theme_window_status_last_attr="none"

tmux_conf_theme_status_left=" #S | #(~/.config/tmux/scripts/anim.sh scan 10 ffb000 3d2a00) "
tmux_conf_theme_status_left_fg="#0c0800,#ffb000"
tmux_conf_theme_status_left_bg="#ffb000,#0c0800"
tmux_conf_theme_status_left_attr="bold,none"
tmux_conf_theme_status_right=" #{prefix}#{synchronized}LOAD #{loadavg} | %Y-%m-%d %H#[blink]:#[noblink]%M#[blink]:#[noblink]%S "
tmux_conf_theme_status_right_fg="#6b4a00,#0c0800"
tmux_conf_theme_status_right_bg="#0c0800,#ffb000"
tmux_conf_theme_status_right_attr="none,bold"
tmux_conf_theme_prefix="PFX "
tmux_conf_theme_prefix_fg="#ffb000"
tmux_conf_theme_synchronized="SYNC "
tmux_conf_theme_synchronized_fg="#ff5f00"

# default text turns amber: bright in the focused pane, dimmer elsewhere
tmux_conf_theme_window_fg="#9a6a00"
tmux_conf_theme_window_bg="default"
tmux_conf_theme_highlight_focused_pane=true
tmux_conf_theme_focused_pane_fg="#ffb000"
tmux_conf_theme_focused_pane_bg="default"
tmux_conf_theme_pane_border_style=thin
tmux_conf_theme_pane_border="#3d2a00"
tmux_conf_theme_pane_active_border="#ffb000"
tmux_conf_theme_pane_indicator="#6b4a00"
tmux_conf_theme_pane_active_indicator="#ffb000"

tmux_conf_theme_message_fg="#0c0800"
tmux_conf_theme_message_bg="#ffb000"
tmux_conf_theme_message_attr="bold"
tmux_conf_theme_message_command_fg="#ffb000"
tmux_conf_theme_message_command_bg="#0c0800"
tmux_conf_theme_message_command_attr="bold"
tmux_conf_theme_mode_fg="#0c0800"
tmux_conf_theme_mode_bg="#ffb000"
tmux_conf_theme_mode_attr="bold"
tmux_conf_theme_clock_colour="#ffb000"

set -g status-position bottom
set -g pane-border-lines double
set -g pane-border-status bottom
set -g pane-border-format '#{?pane_active,#[fg=#0c0800 bg=#ffb000 bold],#[fg=#6b4a00]} #P:#{pane_current_command} #[default]#{?pane_active,#[fg=#c98a00],#[fg=#3d2a00]} #{pane_current_path} '

set -g menu-style          'fg=#ffb000,bg=#0c0800'
set -g menu-selected-style 'fg=#0c0800,bg=#ffb000,bold'
set -g menu-border-style   'fg=#ffb000'
set -g menu-border-lines   double
set -g popup-border-style  'fg=#ffb000'
set -g popup-border-lines  double
