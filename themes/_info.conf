# Info row(s), loaded after the active theme and appended below its own @rows:
# indicators (mouse, keyboard, devices, sync) on the left; system (CPU, memory,
# GPU, network, load), IP addresses and disk on the right. Colours and the
# hud.sh mode come from the theme (@hud_* in _base.conf).
# Clients of 220+ columns get one info row; narrower ones get two, so nothing is
# cut off. @cols is the client width, recorded by scripts/fit.sh from the attach
# and resize hooks; it re-sources this file when a resize crosses that line.

set -g @info_sys '#(~/.config/tmux/scripts/hud.sh #{@hud_args})'
set -g @info_net '#[fg=#{@hud_lan}]#(~/.config/tmux/scripts/net-ip.sh lan)#[fg=#{@hud_wan}]#{E:@wan}#[fg=#{@hud_wifi}]#(~/.config/tmux/scripts/net-ip.sh wifi) #[fg=#{@hud_sep}]┃ #[fg=#{@hud_disk}]#(~/.config/tmux/scripts/disk-free.sh) '

%if #{>=:#{@cols},220}
set -g @layout wide
set -g @info_a '#[align=left] #{E:@ind}#[align=right]#{E:@info_sys}#[fg=#{@hud_sep}]┃ #{E:@info_net}'
%else
set -g @layout narrow
set -g @info_a '#[align=left] #{E:@ind}#[align=right]#{E:@info_sys}'
set -g @info_b '#[align=right]#{E:@info_net}'
%endif

# status-format indexes cannot be formats, so spell out each theme row count
%if #{==:#{@rows},1}
set -g 'status-format[1]' '#{E:@info_a}'
set -g 'status-format[2]' '#{E:@info_b}'
%elif #{==:#{@rows},2}
set -g 'status-format[2]' '#{E:@info_a}'
set -g 'status-format[3]' '#{E:@info_b}'
%endif
%if #{>=:#{@cols},220}
set -gF status '#{e|+:#{@rows},1}'
%else
set -gF status '#{e|+:#{@rows},2}'
%endif

# prompts and messages take the first info row, never the window list
set -gF message-line '#{@rows}'
