# Theme: bubbles. Catppuccin Mocha rounded pills on a transparent bar with a
# blank spacer row, per-program window icons, and a live load spinner.

tmux_conf_theme_colour_1="#1e1e2e"    # base
tmux_conf_theme_colour_2="#313244"    # surface0
tmux_conf_theme_colour_3="#6c7086"    # overlay0
tmux_conf_theme_colour_4="#cba6f7"    # mauve accent
tmux_conf_theme_colour_5="#f9e2af"    # yellow
tmux_conf_theme_colour_16="#f38ba8"   # red: root/sync warning

tmux_conf_theme_status_fg="#a6adc8"
tmux_conf_theme_status_bg="default"
tmux_conf_theme_status_attr="none"

tmux_conf_theme_left_separator_main=""
tmux_conf_theme_left_separator_sub=""
tmux_conf_theme_right_separator_main=""
tmux_conf_theme_right_separator_sub=""

# icon for the window's foreground program
set -g @bub_icon '#{?#{m/r:^n?vim$,#{pane_current_command}},,#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},,#{?#{m/r:^python,#{pane_current_command}},,#{?#{m/r:^node$,#{pane_current_command}},,#{?#{m/r:^(git|lazygit|tig)$,#{pane_current_command}},,#{?#{m/r:^(ssh|mosh)$,#{pane_current_command}},,#{?#{m/r:^(btop|htop|top)$,#{pane_current_command}},,#{?#{m/r:^(omp|claude|codex|bun)$,#{pane_current_command}},󰚩,}}}}}}}}'

tmux_conf_theme_window_status_fg="#a6adc8"
tmux_conf_theme_window_status_bg="default"
tmux_conf_theme_window_status_attr="none"
tmux_conf_theme_window_status_format="#[fg=#313244]#[fg=#a6adc8 bg=#313244]#{E:@bub_icon} #I #W#{?window_zoomed_flag, ,}#{?window_activity_flag, #[fg=#fab387]●,}#{?window_bell_flag, #[fg=#f38ba8],}#[fg=#313244 bg=default]"
tmux_conf_theme_window_status_current_fg="#1e1e2e"
tmux_conf_theme_window_status_current_bg="default"
tmux_conf_theme_window_status_current_attr="none"
tmux_conf_theme_window_status_current_format="#[fg=#cba6f7]#[fg=#1e1e2e bg=#cba6f7 bold]#{E:@bub_icon} #I #W#{?window_zoomed_flag, ,}#[fg=#cba6f7 bg=default nobold]"
tmux_conf_theme_window_status_activity_fg="default"
tmux_conf_theme_window_status_activity_bg="default"
tmux_conf_theme_window_status_activity_attr="none"
tmux_conf_theme_window_status_bell_fg="default"
tmux_conf_theme_window_status_bell_bg="default"
tmux_conf_theme_window_status_bell_attr="none"
tmux_conf_theme_window_status_last_fg="default"
tmux_conf_theme_window_status_last_bg="default"
tmux_conf_theme_window_status_last_attr="none"

tmux_conf_theme_status_left=" #[fg=#89b4fa]#[fg=#1e1e2e bg=#89b4fa bold] #S#[fg=#89b4fa bg=default nobold] "
tmux_conf_theme_status_left_fg="#cdd6f4"
tmux_conf_theme_status_left_bg="default"
tmux_conf_theme_status_left_attr="none"
tmux_conf_theme_status_right=" #{prefix}#{synchronized} #[fg=#313244]#[bg=#313244]#(~/.config/tmux/scripts/anim.sh spin a6e3a1) #[fg=#a6adc8]#{loadavg}#[fg=#313244 bg=default] #[fg=#f5c2e7]#[fg=#1e1e2e bg=#f5c2e7] %H:%M#[fg=#f5c2e7 bg=default] "
tmux_conf_theme_status_right_fg="#cdd6f4"
tmux_conf_theme_status_right_bg="default"
tmux_conf_theme_status_right_attr="none"
tmux_conf_theme_prefix_fg="#f9e2af"

tmux_conf_theme_window_fg="default"
tmux_conf_theme_window_bg="default"
tmux_conf_theme_highlight_focused_pane=false
tmux_conf_theme_pane_border_style=thin
tmux_conf_theme_pane_border="#313244"
tmux_conf_theme_pane_active_border="#cba6f7"
tmux_conf_theme_pane_indicator="#6c7086"
tmux_conf_theme_pane_active_indicator="#cba6f7"

tmux_conf_theme_message_fg="#cdd6f4"
tmux_conf_theme_message_bg="#313244"
tmux_conf_theme_message_attr="none"
tmux_conf_theme_message_command_fg="#cdd6f4"
tmux_conf_theme_message_command_bg="#313244"
tmux_conf_theme_message_command_attr="none"
tmux_conf_theme_mode_fg="#cdd6f4"
tmux_conf_theme_mode_bg="#45475a"
tmux_conf_theme_mode_attr="none"
tmux_conf_theme_clock_colour="#cba6f7"

# 2nd row stays blank: a gap that makes the bar float, and room for prompts
set -g status 2
set -g 'status-format[1]' ''
set -g message-line 1
set -g status-justify centre
set -g pane-border-indicators both

set -g menu-style          'fg=#cdd6f4,bg=#1e1e2e'
set -g menu-selected-style 'fg=#1e1e2e,bg=#cba6f7'
set -g menu-border-style   'fg=#cba6f7'
set -g menu-border-lines   rounded
set -g popup-border-style  'fg=#cba6f7'
set -g popup-border-lines  rounded
