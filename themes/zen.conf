# Theme: zen. One quiet row at the bottom, transparent bar, centred windows,
# inactive panes dimmed so focus is obvious. Kanagawa-ish muted palette.

tmux_conf_theme_colour_1="#1f1f28"    # sumi ink
tmux_conf_theme_colour_2="#353545"    # borders
tmux_conf_theme_colour_3="#7f7e75"    # dim text
tmux_conf_theme_colour_4="#7e9cd8"    # crystal blue accent
tmux_conf_theme_colour_5="#e6c384"    # carp yellow
tmux_conf_theme_colour_16="#e46876"   # red: root/sync warning

tmux_conf_theme_status_fg="#7f7e75"
tmux_conf_theme_status_bg="default"
tmux_conf_theme_status_attr="none"

tmux_conf_theme_left_separator_main=""
tmux_conf_theme_left_separator_sub=""
tmux_conf_theme_right_separator_main=""
tmux_conf_theme_right_separator_sub=""

tmux_conf_theme_window_status_fg="#5f5f7b"
tmux_conf_theme_window_status_bg="default"
tmux_conf_theme_window_status_attr="none"
tmux_conf_theme_window_status_format="#I #W#{?window_zoomed_flag, z,}#{?window_activity_flag,#[fg=#e6c384]·,}"
tmux_conf_theme_window_status_current_fg="#e5e1cb"
tmux_conf_theme_window_status_current_bg="default"
tmux_conf_theme_window_status_current_attr="bold"
tmux_conf_theme_window_status_current_format="#[fg=#7e9cd8]#I#[fg=#e5e1cb] #W#{?window_zoomed_flag, z,}"
tmux_conf_theme_window_status_activity_fg="#5f5f7b"
tmux_conf_theme_window_status_activity_bg="default"
tmux_conf_theme_window_status_activity_attr="none"
tmux_conf_theme_window_status_bell_fg="#e46876"
tmux_conf_theme_window_status_bell_bg="default"
tmux_conf_theme_window_status_bell_attr="bold"
tmux_conf_theme_window_status_last_fg="#7f7e75"
tmux_conf_theme_window_status_last_bg="default"
tmux_conf_theme_window_status_last_attr="none"

tmux_conf_theme_status_left="  #S "
tmux_conf_theme_status_left_fg="#5f5f7b"
tmux_conf_theme_status_left_bg="default"
tmux_conf_theme_status_left_attr="italics"
tmux_conf_theme_status_right=" #{prefix}#{synchronized} %H:%M  "
tmux_conf_theme_status_right_fg="#5f5f7b"
tmux_conf_theme_status_right_bg="default"
tmux_conf_theme_status_right_attr="none"
tmux_conf_theme_prefix_fg="#e6c384"

# inactive panes fade; the focused one keeps the terminal's own colours
tmux_conf_theme_window_fg="#7f7e75"
tmux_conf_theme_window_bg="default"
tmux_conf_theme_highlight_focused_pane=true
tmux_conf_theme_focused_pane_fg="default"
tmux_conf_theme_focused_pane_bg="default"
tmux_conf_theme_pane_border_style=thin
tmux_conf_theme_pane_border="#353545"
tmux_conf_theme_pane_active_border="#7e9cd8"
tmux_conf_theme_pane_indicator="#5f5f7b"
tmux_conf_theme_pane_active_indicator="#7e9cd8"

tmux_conf_theme_message_fg="#e6c384"
tmux_conf_theme_message_bg="default"
tmux_conf_theme_message_attr="none"
tmux_conf_theme_message_command_fg="#e5e1cb"
tmux_conf_theme_message_command_bg="default"
tmux_conf_theme_message_command_attr="none"
tmux_conf_theme_mode_fg="#e5e1cb"
tmux_conf_theme_mode_bg="#2d4f67"
tmux_conf_theme_mode_attr="none"
tmux_conf_theme_clock_colour="#7e9cd8"

set -g status-position bottom
set -g status-justify centre
# colour only: arrow indicators land against the first column of pane text
set -g pane-border-indicators colour

set -g menu-style          'fg=#e5e1cb,bg=#1f1f28'
set -g menu-selected-style 'fg=#1f1f28,bg=#7e9cd8'
set -g menu-border-style   'fg=#5f5f7b'
set -g menu-border-lines   rounded
set -g popup-border-style  'fg=#5f5f7b'
set -g popup-border-lines  rounded
