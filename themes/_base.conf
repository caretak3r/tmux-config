# Loaded before every theme. Resets the plain tmux options themes set, so a
# switch never leaks the previous layout, and holds the glyphs all themes share.
# oh-my-tmux re-applies its own tmux_conf_* options on every load.

set -gu status
set -gu status-format
set -g  status-position top
set -gu status-justify
set -gu message-line
set -gu pane-status-style
set -gu pane-status-current-style
set -gu pane-border-status
set -gu pane-border-lines
set -gu pane-border-format
set -gu pane-border-indicators
set -gu menu-style
set -gu menu-selected-style
set -gu menu-border-style
set -gu menu-border-lines
set -gu popup-style
set -gu popup-border-style
set -gu popup-border-lines

tmux_conf_theme=enabled
tmux_conf_theme_terminal_title="#h · #S · #I #W"
tmux_conf_theme_clock_style="24"

tmux_conf_theme_pairing=""            # nf-fa-users
tmux_conf_theme_prefix="󰌌"            # nf-md-keyboard
tmux_conf_theme_mouse="󰍽"             # nf-md-mouse
tmux_conf_theme_root="!"
tmux_conf_theme_synchronized="󰓦"      # nf-md-sync
tmux_conf_theme_pairing_fg="none"
tmux_conf_theme_pairing_bg="none"
tmux_conf_theme_pairing_attr="none"
tmux_conf_theme_prefix_fg="none"
tmux_conf_theme_prefix_bg="none"
tmux_conf_theme_prefix_attr="none"
tmux_conf_theme_mouse_fg="none"
tmux_conf_theme_mouse_bg="none"
tmux_conf_theme_mouse_attr="none"
tmux_conf_theme_root_fg="none"
tmux_conf_theme_root_bg="none"
tmux_conf_theme_root_attr="bold,blink"
tmux_conf_theme_synchronized_fg="none"
tmux_conf_theme_synchronized_bg="none"
tmux_conf_theme_synchronized_attr="none"

tmux_conf_battery_bar_symbol_full="█"
tmux_conf_battery_bar_symbol_empty="░"
tmux_conf_battery_bar_length="auto"
tmux_conf_battery_bar_palette="gradient"
tmux_conf_battery_hbar_palette="gradient"
tmux_conf_battery_vbar_palette="gradient"
tmux_conf_battery_status_charging=""       # nf-fa-bolt
tmux_conf_battery_status_discharging=""    # nf-fa-battery_3
