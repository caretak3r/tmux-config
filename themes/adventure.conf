# Theme: adventure. Land of Ooo: night-sky bar, every window tab a different candy
# colour, ice-wave tab edges, a Lady Rainicorn session name, rotating catchphrases,
# and a 2nd row where Finn and a shapeshifting Jake walk the grass (scripts/ooo.pl).
# <prefix> A opens the same scene as a smooth 8 fps pane with stars and Lady Rainicorn.

tmux_conf_theme_colour_1="#1b1530"    # night sky
tmux_conf_theme_colour_2="#3a2f5c"    # dusk
tmux_conf_theme_colour_3="#8f84b8"    # twilight text
tmux_conf_theme_colour_4="#ff8ccf"    # bubblegum accent
tmux_conf_theme_colour_5="#f7b32b"    # jake
tmux_conf_theme_colour_16="#e8505b"   # marceline red: root/sync warning

tmux_conf_theme_status_fg="#8f84b8"
tmux_conf_theme_status_bg="#1b1530"
tmux_conf_theme_status_attr="none"

tmux_conf_theme_left_separator_main=""
tmux_conf_theme_left_separator_sub=""
tmux_conf_theme_right_separator_main=""
tmux_conf_theme_right_separator_sub=""

# candy colour per window index: finn, jake, bubblegum, bmo, lumpy space, grass
set -g @at_c '#{?#{==:#{e|%:#{window_index},6},0},#4fa3e0,#{?#{==:#{e|%:#{window_index},6},1},#f7b32b,#{?#{==:#{e|%:#{window_index},6},2},#ff8ccf,#{?#{==:#{e|%:#{window_index},6},3},#5fd3b3,#{?#{==:#{e|%:#{window_index},6},4},#b48ee8,#8ad04f}}}}}'

tmux_conf_theme_window_status_fg="#fff5d6"
tmux_conf_theme_window_status_bg="#1b1530"
tmux_conf_theme_window_status_attr="none"
tmux_conf_theme_window_status_format="#[fg=#{E:@at_c}]#I#[fg=#d8cfee] #W#{?window_zoomed_flag, ,}#{?window_activity_flag,#[fg=#{E:@at_c}]✧,}#{?window_bell_flag, #[fg=#e8505b],}"
tmux_conf_theme_window_status_current_fg="#1b1530"
tmux_conf_theme_window_status_current_bg="#1b1530"
tmux_conf_theme_window_status_current_attr="none"
tmux_conf_theme_window_status_current_format="#[fg=#{E:@at_c} bg=#1b1530]#[fg=#1b1530 bg=#{E:@at_c} bold]★ #I #W#{?window_zoomed_flag, ,}#[fg=#{E:@at_c} bg=#1b1530 nobold]"
tmux_conf_theme_window_status_activity_fg="default"
tmux_conf_theme_window_status_activity_bg="default"
tmux_conf_theme_window_status_activity_attr="none"
tmux_conf_theme_window_status_bell_fg="default"
tmux_conf_theme_window_status_bell_bg="default"
tmux_conf_theme_window_status_bell_attr="none"
tmux_conf_theme_window_status_last_fg="default"
tmux_conf_theme_window_status_last_bg="default"
tmux_conf_theme_window_status_last_attr="none"

tmux_conf_theme_status_left=" #(~/.config/tmux/scripts/anim.sh rainbow '#S' ff5f5f f7b32b fff36b 8ad04f 4fa3e0 b48ee8) #[fg=#3a2f5c]✦ "
tmux_conf_theme_status_left_fg="#fff5d6"
tmux_conf_theme_status_left_bg="#1b1530"
tmux_conf_theme_status_left_attr="bold"
tmux_conf_theme_status_right=" #{prefix}#{synchronized} #[fg=#ff8ccf]#(~/.config/tmux/scripts/anim.sh cycle 6 'Mathematical!' 'Algebraic!' 'Oh my glob!' 'What time is it?' 'Rhombus!' 'Shmowzow!' 'Lumpin!' 'Bacon pancakes!' 'Flipping heck!') #[fg=#f7b32b bg=#1b1530]#[fg=#1b1530 bg=#f7b32b bold]ADVENTURE TIME %H:%M#[fg=#f7b32b bg=#1b1530 nobold] "
tmux_conf_theme_status_right_fg="#8f84b8"
tmux_conf_theme_status_right_bg="#1b1530"
tmux_conf_theme_status_right_attr="none"
tmux_conf_theme_prefix_fg="#f7b32b"
tmux_conf_theme_synchronized_fg="#e8505b"

tmux_conf_theme_window_fg="default"
tmux_conf_theme_window_bg="default"
tmux_conf_theme_highlight_focused_pane=false
tmux_conf_theme_pane_border_style=thin
tmux_conf_theme_pane_border="#3a2f5c"
tmux_conf_theme_pane_active_border="#ff8ccf"
tmux_conf_theme_pane_indicator="#b48ee8"
tmux_conf_theme_pane_active_indicator="#ff8ccf"

tmux_conf_theme_message_fg="#1b1530"
tmux_conf_theme_message_bg="#f7b32b"
tmux_conf_theme_message_attr="bold"
tmux_conf_theme_message_command_fg="#f7b32b"
tmux_conf_theme_message_command_bg="#1b1530"
tmux_conf_theme_message_command_attr="bold"
tmux_conf_theme_mode_fg="#1b1530"
tmux_conf_theme_mode_bg="#ff8ccf"
tmux_conf_theme_mode_attr="bold"
tmux_conf_theme_clock_colour="#f7b32b"

# 2nd row: Finn & Jake walk the windy grass on the left; BMO blinks on the right
set -g status 2
set -g message-line 1
set -g 'status-format[1]' '#[align=left bg=#1b1530]  #(~/.config/tmux/scripts/ooo.sh status 64)#[align=right]#[fg=#3a2f5c]prefix A: smooth  #[fg=#5fd3b3]BMO #(~/.config/tmux/scripts/anim.sh cycle 1 "[◕‿◕]" "[◕‿◕]" "[◕‿◕]" "[-‿-]")  '
set -g pane-border-lines heavy
set -g pane-border-indicators colour

set -g menu-style          'fg=#fff5d6,bg=#1b1530'
set -g menu-selected-style 'fg=#1b1530,bg=#f7b32b,bold'
set -g menu-border-style   'fg=#ff8ccf'
set -g menu-border-lines   rounded
set -g popup-border-style  'fg=#ff8ccf'
set -g popup-border-lines  rounded
