# Unset plain tmux options a theme may set, so switching never leaks the
# previous theme's layout. oh-my-tmux re-applies its own tmux_conf_* options.
set -gu status
set -gu status-format
set -gu pane-status-style
set -gu pane-status-current-style
set -gu pane-border-status
set -gu pane-border-lines
set -gu pane-border-format
